<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital Counter</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background-color: #0b0c10;
    background-image: 
      linear-gradient(rgba(102, 252, 241, 0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(102, 252, 241, 0.05) 1px, transparent 1px);
    background-size: 30px 30px;
    font-family: 'Orbitron', sans-serif;
    color: #c5c6c7;
  }
  .container {
    background: rgba(31, 40, 51, 0.85);
    padding: 50px;
    border-radius: 20px;
    border: 1px solid #45a29e;
    box-shadow: 0 0 40px rgba(102, 252, 241, 0.15), inset 0 0 20px rgba(102, 252, 241, 0.05);
    text-align: center;
    backdrop-filter: blur(10px);
    min-width: 350px;
  }
  h2 {
    font-size: 1.2rem;
    letter-spacing: 3px;
    color: #45a29e;
    margin: 0 0 15px 0;
    text-transform: uppercase;
  }
  h1 {
    font-size: 4rem;
    margin: 0 0 10px 0;
    color: #66fcf1;
    text-shadow: 0 0 20px rgba(102, 252, 241, 0.6);
  }
  h3 {
    font-size: 1.1rem;
    color: #ff4c4c;
    margin: 0 0 35px 0;
    text-shadow: 0 0 10px rgba(255, 76, 76, 0.4);
  }
  .input-group {
    display: flex;
    justify-content: center;
    gap: 15px;
  }
  input {
    background: #0b0c10;
    border: 2px solid #45a29e;
    color: #66fcf1;
    padding: 15px;
    font-size: 1.2rem;
    border-radius: 10px;
    outline: none;
    font-family: 'Orbitron', sans-serif;
    width: 140px;
    text-align: center;
    transition: box-shadow 0.3s ease;
  }
  input:focus {
    box-shadow: 0 0 15px rgba(102, 252, 241, 0.5);
  }
  button {
    background: #66fcf1;
    border: none;
    color: #0b0c10;
    font-weight: 700;
    padding: 15px 30px;
    font-size: 1.2rem;
    border-radius: 10px;
    cursor: pointer;
    text-transform: uppercase;
    font-family: 'Orbitron', sans-serif;
    transition: all 0.3s ease;
    box-shadow: 0 0 15px rgba(102, 252, 241, 0.3);
  }
  button:hover {
    background: #45a29e;
    color: #fff;
    box-shadow: 0 0 25px rgba(102, 252, 241, 0.6);
    transform: translateY(-2px);
  }
  button:active {
    transform: translateY(1px);
  }
</style>
</head>
<body>
<div class="container">
  <h2>Live Balance</h2>
  <h1>₹<span id="amount">0.000000</span></h1>
  <h3>Deducted: ₹<span id="deducted">0.000000</span></h3>
  <div class="input-group">
    <input type="number" id="deductInput" step="0.01" value="0" />
    <button onclick="deductAmount()">Deduct</button>
  </div>
</div>
<script>
  const startDate = new Date("2026-06-09T00:00:00").getTime();
  const ratePerMillisecond = 10 / (24 * 60 * 60 * 1000);
  
  let totalDeducted = parseFloat(localStorage.getItem('totalDeducted')) || 0.0;
  document.getElementById('deducted').innerText = totalDeducted.toFixed(6);

  function updateCounter() {
    const now = new Date().getTime();
    const elapsedMilliseconds = now - startDate;
    let currentAmount = (elapsedMilliseconds * ratePerMillisecond) - totalDeducted;
    
    if (currentAmount < 0) {
      currentAmount = 0;
    }
    
    document.getElementById("amount").innerText = currentAmount.toFixed(6);
    requestAnimationFrame(updateCounter);
  }

  function deductAmount() {
    const deductValue = parseFloat(document.getElementById('deductInput').value);
    
    if (!isNaN(deductValue) && deductValue > 0) {
      totalDeducted += deductValue;
      localStorage.setItem('totalDeducted', totalDeducted);
      document.getElementById('deducted').innerText = totalDeducted.toFixed(6);
      document.getElementById('deductInput').value = 0;
    }
  }

  updateCounter();
</script>
</body>
</html>
