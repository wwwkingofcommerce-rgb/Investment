<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Balance Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-color: #f0f2f5;
    --card-bg: rgba(255, 255, 255, 0.8);
    --text-main: #2d3436;
    --text-sub: #636e72;
    --accent-primary: #0984e3;
    --accent-hover: #076bba;
    --deduct-color: #e17055;
    --shadow: 0 10px 30px rgba(0,0,0,0.05);
  }

  body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background-color: var(--bg-color);
    background-image: 
      radial-gradient(at 10% 10%, rgba(9, 132, 227, 0.05) 0px, transparent 50%),
      radial-gradient(at 90% 90%, rgba(225, 112, 85, 0.05) 0px, transparent 50%);
    font-family: 'Poppins', sans-serif;
    color: var(--text-main);
    -webkit-font-smoothing: antialiased;
  }

  .wrapper {
    text-align: center;
  }

  .app-card {
    background: var(--card-bg);
    padding: 40px 50px;
    border-radius: 30px;
    border: 1px solid rgba(255, 255, 255, 0.3);
    box-shadow: var(--shadow);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    transition: transform 0.3s ease;
  }

  .app-card:hover {
    transform: translateY(-5px);
  }

  .label-main {
    font-size: 0.9rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--text-sub);
    margin-bottom: 5px;
    display: block;
  }

  .accumulated-amount {
    font-size: 4rem;
    font-weight: 600;
    color: var(--accent-primary);
    margin: 0;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }

  .currency-symbol {
    font-size: 2.5rem;
    vertical-align: super;
    margin-right: 5px;
    font-weight: 300;
  }

  .deducted-container {
    margin-top: 10px;
    margin-bottom: 40px;
    padding: 8px 15px;
    background: rgba(0,0,0,0.03);
    border-radius: 50px;
    display: inline-block;
  }

  .label-sub {
    font-size: 0.85rem;
    color: var(--text-sub);
    font-weight: 400;
  }

  .deducted-amount {
    color: var(--deduct-color);
    font-weight: 600;
  }

  .action-area {
    display: flex;
    flex-direction: column;
    gap: 15px;
    align-items: center;
  }

  .input-wrapper {
    position: relative;
  }

  input[type="number"] {
    background: transparent;
    border: none;
    border-bottom: 2px solid #dfe6e9;
    color: var(--text-main);
    padding: 10px;
    font-size: 1.2rem;
    width: 150px;
    text-align: center;
    font-family: 'Poppins', sans-serif;
    outline: none;
    transition: border-color 0.3s ease;
  }

  input[type="number"]:focus {
    border-color: var(--accent-primary);
  }

  input::-webkit-outer-spin-button,
  input::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }

  button {
    background: var(--accent-primary);
    border: none;
    color: white;
    font-weight: 600;
    padding: 12px 40px;
    font-size: 1rem;
    border-radius: 50px;
    cursor: pointer;
    font-family: 'Poppins', sans-serif;
    transition: all 0.3s ease;
    box-shadow: 0 4px 15px rgba(9, 132, 227, 0.2);
  }

  button:hover {
    background: var(--accent-hover);
    box-shadow: 0 6px 20px rgba(9, 132, 227, 0.3);
  }

  button:active {
    transform: scale(0.97);
  }

</style>
</head>
<body>

<div class="wrapper">
  <div class="app-card">
    <span class="label-main">Current Balance</span>
    <p class="accumulated-amount"><span class="currency-symbol">₹</span><span id="amount">0.000000</span></p>
    
    <div class="deducted-container">
      <span class="label-sub">Total Removed: <span class="deducted-amount">₹<span id="deducted">0.000000</span></span></span>
    </div>

    <div class="action-area">
      <div class="input-wrapper">
        <input type="number" id="deductInput" step="1" placeholder="0" onfocus="this.placeholder = ''" onblur="this.placeholder = '0'"/>
      </div>
      <button onclick="deductAmount()">Deduct Funds</button>
    </div>
  </div>
</div>

<script>
  const startDate = new Date("2026-06-09T00:00:00").getTime();
  const ratePerMillisecond = 10 / (24 * 60 * 60 * 1000);
  
  let totalDeducted = parseFloat(localStorage.getItem('clean_totalDeducted')) || 0.0;
  document.getElementById('deducted').innerText = totalDeducted.toFixed(6);

  function updateCounter() {
    const now = new Date().getTime();
    const elapsedMilliseconds = now - startDate;
    let currentAmount = (elapsedMilliseconds * ratePerMillisecond) - totalDeducted;
    
    document.getElementById("amount").innerText = currentAmount.toFixed(6);
    requestAnimationFrame(updateCounter);
  }

  function deductAmount() {
    const deductInput = document.getElementById('deductInput');
    const deductValue = parseFloat(deductInput.value);
    
    if (!isNaN(deductValue) && deductValue > 0) {
      totalDeducted += deductValue;
      localStorage.setItem('clean_totalDeducted', totalDeducted);
      document.getElementById('deducted').innerText = totalDeducted.toFixed(6);
      deductInput.value = '';
    }
  }

  updateCounter();
</script>
</body>
</html>
